# MT5 terminal (Wine) + RPyC bridge that the scalper bot talks to.
#
# This file is committed and contains NO secrets. Credentials are read from
# .env (gitignored) via env_file. See .env.example for the template.
#
# Usage:
#   cp .env.example .env   # once, then fill in real values
#   docker compose up -d

services:
  mt5:
    container_name: mt5
    # Local image snapshotted from the patched container (fixes the stale-fifo
    # and set -e restart bugs in lprett/mt5linux):
    #   docker commit mt5 lprett-mt5linux-patched
    # You can switch back to lprett/mt5linux:latest once upstream fixes them:
    # https://github.com/lucas-campagna/mt5linux
    image: lprett-mt5linux-patched
    restart: unless-stopped
    env_file:
      - .env              # MT5_LOGIN / MT5_PASSWORD / MT5_SERVER / VNC_PASSWORD
    environment:
      MT5_HOST: 0.0.0.0   # bind address of the RPyC server inside the container
      RPYC_PORT: 18812
      NOVNC_PORT: 5901
      NOVNC_PAGE_PORT: 8080
      NOVNC_HOST: localhost
    ports:
      - "18812:18812"     # RPyC bridge — the bot connects here (config.HOST/PORT)
      - "5901:5901"       # noVNC websocket
      - "8080:8080"       # noVNC web UI: http://<server-ip>:8080
